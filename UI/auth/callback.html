<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORION — Connecting Sorare…</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg:#0d0d1a; --surface:#13131f; --border:#2a2a45; --purple:#b060ff; --text:#e8e8ff; --text2:#9090c0; --down:#ff2d78; --up:#00f5a0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Exo 2',sans-serif; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:34px 30px;
          max-width:420px; width:100%; text-align:center; box-shadow:0 0 60px rgba(176,96,255,.14); }
  .logo { font-family:'Orbitron',monospace; font-size:22px; font-weight:900; letter-spacing:.06em; margin-bottom:22px; }
  .logo span { color:var(--purple); }
  .msg { font-family:'Share Tech Mono',monospace; font-size:13px; color:var(--text2); line-height:1.7; }
  .msg b { color:var(--text); }
  .ok   { color:var(--up); }
  .err  { color:var(--down); }
  .spin { width:34px; height:34px; margin:0 auto 18px; border:2px solid var(--border);
          border-top-color:var(--purple); border-radius:50%; animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  a.btn { display:inline-block; margin-top:20px; border:1px solid var(--purple); color:var(--purple);
          font-family:'Orbitron',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
          text-decoration:none; padding:11px 20px; border-radius:5px; }
  a.btn:hover { background:var(--purple); color:var(--bg); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">SORION<span>_</span></div>
  <div class="spin" id="spin"></div>
  <div class="msg" id="msg">// connecting your Sorare account…</div>
  <div id="actions"></div>
</div>

<script>
  const SUPABASE_URL = 'https://jxhdlcpdupmkpsoytzes.supabase.co';
  const ANON_KEY     = 'sb_publishable_cplVdUDlMw1S5IcjlwxPTA_Mx8G7016';
  const CALLBACK     = 'https://sorion.pro/auth/callback';

  const msg  = document.getElementById('msg');
  const spin = document.getElementById('spin');
  const acts = document.getElementById('actions');
  const done = (html, cls) => {
    spin.style.display = 'none';
    msg.className = 'msg ' + (cls || '');
    msg.innerHTML = html;
  };
  const backToProfile = '<a class="btn" href="../profile.html">Back to profile</a>';

  (async () => {
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const err  = params.get('error_description') || params.get('error');
    if (err)  return done('// Sorare returned an error:<br><b>' + err.replace(/[<>]/g, '') + '</b>' + backToProfile, 'err');
    if (!code) return done('// missing authorization code' + backToProfile, 'err');

    // Sorion-Session: die Verknuepfung setzt voraus, dass man hier eingeloggt ist —
    // der Sorare-Login ist NUR der Nachweis fuer den Manager-Slug, kein Zweitkonto.
    let session = null;
    try { session = JSON.parse(localStorage.getItem('sorion_session') || 'null'); } catch {}
    if (!session?.access_token) {
      return done('// you need to be signed in to SORION first.<br>Sign in, then connect Sorare from your profile.' + backToProfile, 'err');
    }

    try {
      // 1) Code gegen ein Sorare-Token tauschen (serverseitig, Client-Secret bleibt geheim)
      const exRes = await fetch(`${SUPABASE_URL}/functions/v1/sorare-oauth`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
        body: JSON.stringify({ action: 'exchange', code, redirect_uri: CALLBACK }),
      });
      const ex = await exRes.json();
      if (!ex.access_token) throw new Error(ex.error || 'token exchange failed');

      // 2) Verknuepfen: Server prueft Sorion-JWT UND Sorare-Token und schreibt den Slug
      const linkRes = await fetch(`${SUPABASE_URL}/functions/v1/sorare-oauth`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json', 'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + session.access_token,
        },
        body: JSON.stringify({ action: 'link_sorare', access_token: ex.access_token }),
      });
      const link = await linkRes.json();
      if (!linkRes.ok) throw new Error(link.error || 'linking failed');

      done('// connected as <b>' + String(link.sorare_slug).replace(/[<>]/g, '') + '</b><br>your portfolio is now tied to this account.' + backToProfile, 'ok');
      setTimeout(() => { location.href = '../profile.html'; }, 2200);
    } catch (e) {
      done('// ' + String(e.message).replace(/[<>]/g, '') + backToProfile, 'err');
    }
  })();
</script>
</body>
</html>
